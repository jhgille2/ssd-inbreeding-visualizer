name: Regenerate SSD dataset

# Re-runs the AlphaSimR reference simulation (R/simulate_ssd.R) and commits a
# fresh docs/ssd_data.json. Run manually or monthly; each run is a new realized
# lineage under the seed fixed in the R script.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("AlphaSimR", "jsonlite"), repos = "https://cloud.r-project.org")'
      - name: Run AlphaSimR simulation
        run: Rscript R/simulate_ssd.R
      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ssd_data.json
          git diff --cached --quiet || git commit -m "Regenerate SSD dataset via AlphaSimR [skip ci]"
          git push
